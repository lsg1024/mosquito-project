name: mosuito
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.17.0
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.7
  cloud_firestore: ^5.1.0
  http: ^0.13.5

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:

  uses-material-design: true
  assets:
    - images/

  fonts:
    - family: Schyler

      fonts:
        - asset: assets/fonts/InknutAntiqua-Black.ttf
        - asset: assets/fonts/InknutAntiqua-Bold.ttf